</style></head><body><video id="arCamera" autoplay muted playsinline aria-hidden="true"></video><div class="ar-orb" aria-hidden="true"></div><main><header class="top"><div class="logo">CTRL<b>+Z</b></div><div class="chip">RE:START MY LIFE · 2000.exe</div></header><div class="ar-tools"><button class="primary-ar" id="arToggle" type="button">📷 開啟 AR 實景遊戲</button><button id="arFlip" type="button" class="hide">🔄 切換鏡頭</button></div><p class="ar-label" id="arLabel">AR LIVE · 相機背景已啟動，請選擇故事開始遊玩</p><div class="window"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="file">✦ parallel_life.exe</span><span>×</span></div><section class="content" id="app" aria-live="polite"><div class="eyebrow">WELCOME TO YOUR ALTERNATE UNIVERSE</div><h1 class="hero">另一個我，<span class="gradient">過得好嗎？</span></h1><p class="sub">遊戲正在載入。如果畫面停在這裡，請用 Safari 開啟 GitHub Pages 網址，不要使用檔案預覽。</p><p class="hint">30 道人生選擇 · 六條故事線</p></section></div><div class="footer">ERROR 404: PERFECT LIFE NOT FOUND</div></main><div id="toast" class="toast hidden" role="status"></div><script>
const STORIES=[{"id":"LOVE","emoji":"💔","exe":"LOVE.exe","title":"感情重啟","tag":"如果當初沒有放手，我們還會在一起嗎？","questions":[{"text":"凌晨 2:17，前任傳來「最近還好嗎？」","options":["立刻回覆：其實我很想你","先放著，明天再說","問問自己為何還在意"],"outcomes":["對方幾乎秒回：「我以為你不會再找我。」一扇熟悉的門重新打開。","手機安靜了一夜。隔天，你發現自己第一次沒有被訊息綁住。","你寫下真正想念的是誰，也發現有些感覺不是愛。"]},{"text":"你發現對方也曾想復合。","options":["提出重新開始","問清楚當初的問題","承認彼此仍需要時間"],"outcomes":["你們約定重新了解彼此，但舊問題沒有因此消失。","談話揭開了當年沒有說出口的委屈，答案比想像中複雜。","你們決定暫緩復合；留白也可以是一種選擇。"]},{"text":"重新靠近後，熟悉的爭執又出現。","options":["坦白說出需求","忍耐，避免失去","設定彼此的界線"],"outcomes":["你們第一次把不滿說清楚，關係開始有新的規則。","爭吵暫時停止，但你發現自己越來越不像自己。","你把界線說出口，對方卻不確定能否接受。"]},{"text":"另一個你沒有復合，卻也有遺憾。","options":["比較誰比較幸福","接受兩條路都有代價","試著理解她的選擇"],"outcomes":["你看見她的日記：她自由，卻也曾深夜哭泣。","畫面消失前，另一個你留下一句：「別把我想得太完美。」","她告訴你：沒有復合的那條路，也要學會獨處。"]},{"text":"另一個你問：「還會勇敢去愛嗎？」","options":["會，但不再弄丟自己","先把愛留給自己","願意慢慢學會愛"],"outcomes":["你決定繼續愛，但這次把自己的需要也放進未來。","你選擇先成為自己的依靠，故事不以戀愛作結。","你沒有給標準答案，而是留下慢慢學習的勇氣。"]}],"endings":["再次相愛的你","選擇自己的你","重新定義愛的你"]},{"id":"FRIEND","emoji":"🫂","exe":"FRIEND.exe","title":"友情存檔","tag":"如果當初沒有吵架，我們還會是朋友嗎？","questions":[{"text":"好友群組約出門，唯獨沒有通知你。","options":["直接問原因","假裝沒看到","私訊最信任的人"],"outcomes":["你問出口後才知道，朋友以為你最近不想參加。","你默默退出群組，卻始終沒有得到真正的答案。","私訊揭開誤會：有人忘了轉達，不代表沒人在乎。"]},{"text":"你們共同的秘密被傳出去。","options":["立刻追究","暫時保持距離","先確認消息來源"],"outcomes":["你要求解釋，卻發現指責無法立即修復信任。","你先遠離群組，換來安靜，也失去聯絡。","真相浮現：秘密是無意間傳出去的，但傷害仍存在。"]},{"text":"你發現對方也曾感到被忽略。","options":["道歉並傾聽","堅持自己沒錯","一起回顧誤會"],"outcomes":["你先說對不起，朋友終於願意談起當年的孤單。","對話變成辯論，你們發現誰都想被理解。","兩人第一次完整說完自己的版本，沉默不再那麼尖銳。"]},{"text":"重逢時，對方問能否從頭開始。","options":["答應重新建立信任","禮貌拒絕","慢慢來，不急著定義"],"outcomes":["你們約定從偶爾聊天開始，信任慢慢回來。","你們笑著道別；不是所有重逢都需要重新開始。","你們沒有急著貼上「最好朋友」標籤，反而更自在。"]},{"text":"系統顯示：友情不一定永遠同一種形狀。","options":["珍惜現在還在的人","勇敢修復值得的關係","允許彼此走向不同人生"],"outcomes":["你留住感謝，回憶不再只是失去。","你主動寄出邀請，但也準備好接受任何答案。","你明白同行的時間不同，不代表那段友情是假的。"]}],"endings":["修復連結的你","溫柔告別的你","自在同行的你"]},{"id":"DREAM","emoji":"🌠","exe":"DREAM.exe","title":"夢想分岔","tag":"如果當初勇敢追夢，我現在會在哪裡？","questions":[{"text":"你拿到夢想工作面試，卻與期末報告撞期。","options":["衝去面試","完成報告","詢問是否能調整時間"],"outcomes":["你錯過報告但拿到面試機會，代價立刻出現。","你完成報告，面試機會卻悄悄關閉。","你爭取改期，發現選擇不一定只有二選一。"]},{"text":"你存的錢只夠撐三個月。","options":["全職衝刺","先找穩定工作","兼職維持創作"],"outcomes":["你全力投入，三個月後資金開始見底。","你有收入，卻總在下班後想起未完成的作品。","你慢慢累積作品，進度較慢，但生活還能呼吸。"]},{"text":"陌生品牌邀你合作，卻要求改掉風格。","options":["接受曝光","拒絕合作","提出雙方可接受的方案"],"outcomes":["作品被看見，卻開始不像你的創作。","你守住風格，也失去一次曝光機會。","雙方願意調整，你學到創作也需要談判。"]},{"text":"平行宇宙的你成功了，卻失去很多休息時間。","options":["羨慕那條路","重新定義成功","重新調整夢想的節奏"],"outcomes":["她在掌聲裡告訴你：成功不會自動治好焦慮。","你發現自己真正羨慕的是她敢選擇的能力。","你問出她沒說的代價，開始重新定義夢想。"]},{"text":"十年後的你留下最後一段語音。","options":["我會繼續試","我想先照顧生活","我要走出自己的版本"],"outcomes":["你願意繼續冒險，也準備承擔不被看見的日子。","你選擇先站穩，夢想不必今天就實現。","你找到自己的節奏：持續創作比一次爆紅重要。"]}],"endings":["追光冒險家","穩定築夢者","長跑創作者"]},{"id":"SCHOOL","emoji":"🎓","exe":"SCHOOL.exe","title":"青春重選","tag":"如果重回18歲，你會做一樣的選擇嗎？","questions":[{"text":"放榜當天，你在喜歡與穩定的科系間猶豫。","options":["選最有熱情的","選較穩定的","先研究課程與出路"],"outcomes":["你走進熱愛的科系，也迎來不確定的未來。","你得到安心，卻忍不住想像另一條路。","你查了課表和實習機會，第一次把喜好變成計畫。"]},{"text":"你發現現在的科系不是想像中那樣。","options":["考慮轉系","先撐完這學期","找老師與學長姐聊聊"],"outcomes":["轉系申請表就在桌上，你開始面對家人的擔心。","你撐過這學期，也更清楚自己不喜歡什麼。","老師的一句建議讓你發現跨域的可能。"]},{"text":"朋友邀你一起做畢業專題。","options":["立刻組隊","想獨立完成","先討論彼此期待"],"outcomes":["你們立刻組隊，才發現彼此工作習慣完全不同。","你決定單打獨鬥，自由多了，壓力也多了。","你們先訂分工和期限，衝突沒有消失但比較能處理。"]},{"text":"畢業前夕，你收到一封寫給18歲自己的信。","options":["感謝當初的勇氣","原諒曾經的失誤","記住一路陪伴的人"],"outcomes":["你讀到當年的勇敢，突然想謝謝那個自己。","你發現後悔並不等於失敗。","你想起有人陪你走過那些難熬的日子。"]},{"text":"校門口的時間機器最後問你。","options":["重來一次","保留所有回憶","只改變明天的選擇"],"outcomes":["你按下重來，卻發現新的選擇也會產生新的遺憾。","你保留青春的所有版本，包括不完美的部分。","你決定不修改昨天，而是為明天開新檔案。"]}],"endings":["勇敢重選者","青春收藏家","明日開拓者"]},{"id":"FUTURE","emoji":"🚀","exe":"FUTURE.exe","title":"未來人生","tag":"高薪、自由與熱愛，你會怎麼選？","questions":[{"text":"你同時收到高薪加班與低薪彈性兩份工作。","options":["選高薪","選自由","比較長期成長"],"outcomes":["薪水變多，週末卻越來越少。","你有時間生活，但每月都要精打細算。","你選了成長空間，短期內仍需要忍受不確定。"]},{"text":"朋友邀你一起創業。","options":["投入全部存款","直接拒絕","先做小規模測試"],"outcomes":["創業計畫啟動，第一筆訂單比想像中難。","你留在原工作，卻開始懷疑自己是否太保守。","小測試失敗了，但你保住資金並學到真正需求。"]},{"text":"AI 工具改變了你熟悉的工作。","options":["主動學新技能","逃避改變","結合原本專長轉型"],"outcomes":["你開始學新工具，工作變得不熟悉，也有新機會。","你努力維持原樣，直到任務逐漸被改變。","你把原有專長與新技術結合，找到自己的位置。"]},{"text":"30歲的你從未來傳來一則訊息：「別只追數字。」","options":["重新設定生活目標","繼續拚財富","兼顧財務與生活"],"outcomes":["你第一次安排沒有工作的週末。","你升上更高的位置，卻忘了多久沒見朋友。","你開始把時間和收入一起列入人生目標。"]},{"text":"最後一道門寫著「成功的人生」。","options":["選擇安穩","選擇冒險","由自己定義成功"],"outcomes":["你選擇安穩，也接受生活不必一直衝刺。","你踏上未知，知道冒險不是免費的。","你不再讓別人替你定義「成功」。"]}],"endings":["安穩建築師","未知探險家","自由定義者"]},{"id":"ME","emoji":"🪞","exe":"ME.exe","title":"另一個自己","tag":"如果不在意眼光，你會成為誰？","questions":[{"text":"你發了一張自拍，卻忍不住一直看讚數。","options":["不斷刷新","刪掉照片","關閉通知去做喜歡的事"],"outcomes":["讚數一直增加，你卻越來越不安。","照片消失了，焦慮卻沒有立刻跟著消失。","你放下手機，發現快樂不一定需要被看見。"]},{"text":"大家都說你應該走某條人生路。","options":["照著做","全部反著做","想清楚自己的價值"],"outcomes":["你照著大家期待走，得到稱讚卻感到陌生。","你反抗所有人，卻發現反抗也可能被別人控制。","你第一次認真寫下自己在意的三件事。"]},{"text":"社群上的同齡人看起來都很成功。","options":["更加焦慮","退出所有社群","提醒自己畫面不是全部"],"outcomes":["你越滑越焦慮，像被困在別人的精選人生。","你暫時離線，卻還要學習面對自己的想法。","你開始區分「別人的展示」和「自己的生活」。"]},{"text":"系統提供「完美人格」下載。","options":["立即安裝","直接刪除","檢視這個完美由誰定義"],"outcomes":["完美人格上線，所有人喜歡你，但你不認得鏡中的人。","你刪除安裝檔，決定保留自己的缺點。","你看見「完美」是別人設下的標準，不必下載。"]},{"text":"另一個你伸出手：「願意一起往前嗎？」","options":["擁抱不完美的自己","慢慢學著接納","帶著疑問繼續前進"],"outcomes":["你擁抱了不完美，鏡子終於不再像考卷。","你允許自己慢慢進步，不再要求一天變好。","你帶著不確定往前，仍然是完整的自己。"]}],"endings":["真實發光體","溫柔成長者","不完美勇者"]}];
const KEY='ctrlz_save_v4_30';let state={page:'home',story:null,step:0,answers:[]};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&['home','select','play','reveal','result'].includes(x.page)&&Array.isArray(x.answers)&&(!x.story||STORIES.some(s=>s.id===x.story))){state=x;state.step=Math.max(0,Math.min(5,Number(state.step)||0));state.answers=state.answers.slice(0,5);if(state.page==='play'&&state.step===5)state.page='result'}}catch(e){}}
function story(){return STORIES.find(s=>s.id===state.story)}
function stats(){let n=[0,0,0];state.answers.forEach((a,i)=>{if(a===0)n[0]+=2;else if(a===1)n[1]+=2;else n[2]+=2;if(i===8)n[a]+=1});return n}
function go(page){state.page=page;save();render();scrollTo({top:0,behavior:'smooth'})}
function start(id){state={page:'play',story:id,step:0,answers:[]};save();render();scrollTo(0,0)}
function choose(i){state.answers[state.step]=i;state.answers.length=state.step+1;state.step++;go('reveal')}
function advance(){go(state.step>=5?'result':'play')}
function undo(){if(state.step===0)return;state.step--;state.answers.length=state.step;go('play')}
function home(){state={page:'home',story:null,step:0,answers:[]};go('home')}
function resultData(){const s=stats();let idx=state.answers[4] ?? s.indexOf(Math.max(...s));let names=story().endings;let descriptions=['你願意為可能性冒險，也正在學習承擔選擇的代價。','你重視關係與安定，也值得為自己的需要保留空間。','你習慣觀察、理解與調整，不必急著找到唯一正解。'];return {name:names[idx],description:descriptions[idx],score:s}}
function render(){let s=story();if(state.page==='home'){app.innerHTML=`<div class="eyebrow">WELCOME TO YOUR ALTERNATE UNIVERSE</div><h1 class="hero">另一個我，<br><span class="gradient">過得好嗎？</span></h1><p class="sub">如果人生可以重選，你會按下 CTRL+Z 嗎？<br>六條時間線、30 道人生選擇，解鎖另一個自己。</p><div class="portal" aria-hidden="true"><span>✦</span></div><button class="btn" data-action="select">✦ 開啟我的平行人生</button><p class="hint">免登入 · 手機可玩 · 每條故事 5 題</p>`}
else if(state.page==='select'){app.innerHTML=`<div class="eyebrow">SELECT YOUR TIMELINE</div><h1 class="hero" style="font-size:29px">你想重選<span class="gradient">哪段人生？</span></h1><p class="sub">選擇一條故事線，每條有 5 個關鍵抉擇。</p><div class="cards">${STORIES.map(x=>`<button class="story" data-story="${x.id}"><div class="emoji">${x.emoji}</div><strong>${esc(x.title)}</strong><small>${esc(x.exe)} · 5 LEVELS</small><p>${esc(x.tag)}</p></button>`).join('')}</div><div class="controls"><button class="btn secondary" data-action="home">← 返回首頁</button></div>`}
else if(state.page==='play'&&s){let q=s.questions[state.step],n=stats();app.innerHTML=`<div class="eyebrow">${esc(s.exe)} · LEVEL ${String(state.step+1).padStart(2,'0')} / 05</div><div class="progress" aria-label="進度 ${state.step} / 5"><div class="fill" style="width:${state.step*20}%"></div></div><div class="stats"><div class="stat">✦ 勇氣 ${n[0]}</div><div class="stat">♡ 連結 ${n[1]}</div><div class="stat">◎ 自由 ${n[2]}</div></div><div class="scene"><div class="eyebrow" style="text-align:left">SYSTEM MESSAGE · ${esc(s.title)}</div><h2>${esc(state.step>0 ? s.questions[state.step-1].outcomes[state.answers[state.step-1]]+" ／ "+q.text : q.text)}</h2>${q.options.map((o,i)=>`<button class="choice" data-choice="${i}">${esc(o)}</button>`).join('')}</div><p class="sub" style="font-size:12px">選擇後會出現專屬劇情，最後一題決定你的結局。</p><div class="controls"><button class="btn secondary" data-action="undo" ${state.step===0?'disabled':''}>↶ CTRL+Z 撤銷</button><button class="btn secondary" data-action="select">更換故事</button></div>`}
else if(state.page==='reveal'&&s){let last=state.step-1,answer=state.answers[last],q=s.questions[last];app.innerHTML=`<div class="eyebrow">TIMELINE SHIFT · ${String(state.step).padStart(2,'0')} / 05</div><div class="scene"><div class="eyebrow" style="text-align:left;color:#ffb2e5">⚠ SYSTEM UPDATE · 你的選擇改變了故事</div><h2>${esc(q.outcomes[answer])}</h2><p class="sub">${state.step===3?'⚡ 命運反轉：得到一件事，也可能失去另一件事。':'另一條時間線正在重組…'}</p></div><button class="btn" data-action="advance">${state.step>=5?'✦ 解鎖我的人生結局':'→ 繼續下一個事件'}</button><div class="controls"><button class="btn secondary" data-action="undo">↶ CTRL+Z 改選</button></div>`}
else if(state.page==='result'&&s){let r=resultData();app.innerHTML=`<div class="eyebrow">YOUR PARALLEL LIFE FILE IS READY</div><div class="result" id="result-card"><div class="mini">✦ CTRL+Z / ${esc(s.exe)}</div><h2>${esc(r.name)}</h2><p>${esc(r.description)}</p><p>你完成了「${esc(s.title)}」的五次關鍵選擇。最後一個決定帶你走向「${esc(r.name)}」。另一條路或許不同，卻沒有哪條路能保證完美。</p><div class="mini">勇氣 ${r.score[0]}　♡ 連結 ${r.score[1]}　◎ 自由 ${r.score[2]}</div><p style="font-size:13px">ERROR 404: PERFECT LIFE NOT FOUND<br>但你可以決定下一步。</p></div><div class="actions"><button class="btn" data-action="download">↓ 下載我的人生結果卡 PNG</button><button class="btn secondary" data-action="share">↗ 分享我的平行人生</button><button class="btn secondary" data-action="retry">↶ 再玩一次這條時間線</button><button class="btn secondary" data-action="select">✦ 解鎖其他人生</button></div>`}
}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.story)start(b.dataset.story);else if(b.dataset.choice!==undefined)choose(Number(b.dataset.choice));else {let a=b.dataset.action;if(a==='select')go('select');if(a==='home')home();if(a==='undo')undo();if(a==='advance')advance();if(a==='retry')start(state.story);if(a==='download')download();if(a==='share')share()}});
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.classList.add('hidden'),2600)}
function makeCard(){let s=story(),r=resultData(),c=document.createElement('canvas');c.width=1080;c.height=1920;let g=c.getContext('2d'),bg=g.createLinearGradient(0,0,1080,1920);bg.addColorStop(0,'#161530');bg.addColorStop(.5,'#4b3378');bg.addColorStop(1,'#166c91');g.fillStyle=bg;g.fillRect(0,0,1080,1920);g.strokeStyle='#a4eaff';g.lineWidth=9;g.strokeRect(65,220,950,1420);g.fillStyle='#92e8ff';g.font='bold 74px sans-serif';g.fillText('CTRL+Z',115,170);g.fillStyle='#ffb1e5';g.font='bold 39px sans-serif';g.fillText('YOUR PARALLEL LIFE',120,350);g.fillStyle='#fff';g.font='bold 80px sans-serif';g.fillText(r.name,120,520);g.font='42px sans-serif';g.fillText(s.title,120,635);g.font='36px sans-serif';const lines=['你完成了五次關鍵選擇。','另一條路也有代價，','但每一步都屬於你。'];lines.forEach((t,i)=>g.fillText(t,120,800+i*80));g.fillStyle='#92e8ff';g.font='bold 43px sans-serif';g.fillText(`勇氣 ${r.score[0]}   連結 ${r.score[1]}   自由 ${r.score[2]}`,120,1190);g.fillStyle='#fff';g.font='34px sans-serif';g.fillText('ERROR 404: PERFECT LIFE NOT FOUND',120,1460);g.fillText('但你可以決定下一步。',120,1540);g.font='29px sans-serif';g.fillText('RE:START MY LIFE · 2000.exe',120,1780);return c}
function download(){let c=makeCard();c.toBlob(blob=>{if(!blob){toast('圖片產生失敗');return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CTRL-Z-'+state.story+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已產生 PNG，請查看下載項目')},'image/png')}
async function share(){let s=story(),r=resultData(),message=`我的 CTRL+Z 平行人生：${s.title}｜${r.name}。你會選哪條路？`;try{if(navigator.share){await navigator.share({title:'CTRL+Z｜如果人生可以重選',text:message,url:location.protocol.startsWith('http')?location.href:undefined});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(message+' '+location.href);toast('分享文字與網址已複製');return}toast('請使用瀏覽器分享功能，或截圖結果卡')}catch(e){if(e.name!=='AbortError')toast('分享失敗，請先下載結果卡')}}

// Camera-based AR overlay. No image-target or spatial tracking is claimed.
let arStream=null, arFacing='environment', arBusy=false;
const arVideo=document.getElementById('arCamera');
const arToggle=document.getElementById('arToggle');
const arFlip=document.getElementById('arFlip');
function stopAR(){if(arStream){arStream.getTracks().forEach(t=>t.stop());arStream=null}arVideo.srcObject=null;document.body.classList.remove('ar-on');arToggle.textContent='📷 開啟 AR 實景遊戲';arFlip.classList.add('hide')}
async function startAR(facing='environment'){
 if(arBusy)return;arBusy=true;arToggle.disabled=true;arToggle.textContent='正在啟動相機…';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('UNSUPPORTED');
  if(!window.isSecureContext)throw new Error('HTTPS');
  if(arStream){arStream.getTracks().forEach(t=>t.stop());arStream=null;arVideo.srcObject=null}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}})}
  catch(e){if(e.name==='OverconstrainedError')stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});else throw e}
  arStream=stream;arFacing=facing;arVideo.srcObject=stream;
  try{await arVideo.play()}catch(e){}
  document.body.classList.add('ar-on');arToggle.textContent='✕ 關閉 AR 模式';arFlip.classList.remove('hide');toast('AR 實景模式已開啟，現在可以玩 30 題故事！');
 }catch(e){stopAR();let msg=e.message==='HTTPS'?'手機相機需要 HTTPS 網址，請透過 GitHub Pages 開啟':e.message==='UNSUPPORTED'?'此瀏覽器不支援相機，請改用 Chrome 或 Safari':e.name==='NotAllowedError'?'相機權限遭拒，請在瀏覽器設定允許相機':e.name==='NotFoundError'?'找不到可用相機':'相機啟動失敗，請確認權限並重新嘗試';toast(msg);alert(msg)}
 finally{arBusy=false;arToggle.disabled=false}
}
arToggle.addEventListener('click',()=>{if(arStream)stopAR();else startAR()});
arFlip.addEventListener('click',()=>startAR(arFacing==='environment'?'user':'environment'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&arStream)stopAR()});
window.addEventListener('pagehide',stopAR);

try { load(); render(); } catch (error) { document.getElementById("app").innerHTML = `<h2>遊戲載入失敗</h2><p>請用 Safari 開啟 GitHub Pages 網址。</p><p style="overflow-wrap:anywhere;font-size:12px">${String(error.message).replace(/[<>&]/g, "")}</p>`; }
</script></body></html>
