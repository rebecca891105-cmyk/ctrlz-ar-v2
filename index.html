
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTRL+Z｜平行人生實驗室</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;color:white;font-family:Arial,"Microsoft JhengHei",sans-serif}
a-scene{position:fixed!important;inset:0;width:100%!important;height:100%!important;z-index:0}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,8,25,.65),transparent 35%,rgba(5,8,25,.8));pointer-events:none;z-index:1}
#ui{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:32px;letter-spacing:4px;margin:0}
small{letter-spacing:3px;color:#b9e9ff}
#status{font-size:12px;border:1px solid #8fdfff;padding:10px;border-radius:24px;background:#14213cbb}
#portal{position:absolute;top:37%;left:50%;transform:translate(-50%,-50%);width:min(72vw,330px);aspect-ratio:1;border:8px solid #a4efff;border-radius:50%;box-shadow:0 0 25px #62dfff,0 0 80px #db83ff,inset 0 0 55px #a78aff;background:radial-gradient(circle,#d9a5ff77,#4a6eff44 40%,transparent 70%);animation:spin 6s linear infinite;pointer-events:none;display:none}
#portal:after{content:"另一個你";position:absolute;inset:0;display:grid;place-items:center;font-size:25px;text-shadow:0 0 20px white;animation:pulse 2s infinite}
@keyframes spin{50%{box-shadow:0 0 55px #ff8cdb,0 0 100px #67e8ff,inset 0 0 50px #f4aaff}}
@keyframes pulse{50%{opacity:.5;transform:scale(1.08)}}
#panel{background:linear-gradient(135deg,#132441ee,#2d193fee);border:1px solid #91dfff88;border-radius:25px;padding:22px;box-shadow:0 0 35px #83dfff33;max-height:55vh;overflow-y:auto;backdrop-filter:blur(12px)}
#panel h2{font-size:23px;margin:8px 0 14px}
#story{font-size:15px;line-height:1.8;color:#e4edff}
button{display:block;width:100%;padding:15px;margin-top:11px;border:1px solid #b2eaff99;border-radius:15px;background:linear-gradient(100deg,#9deaff,#e5b0ff);color:#16213a;font-size:16px;font-weight:bold;cursor:pointer}
button.secondary{background:#ffffff18;color:white}
#stats{display:none;gap:8px;justify-content:space-between;margin:10px 0;font-size:12px;color:#c8eaff}
#foot{text-align:center;font-size:12px;color:#d3dcff;margin-top:12px}
 
/* CTRL+Z 全螢幕 AR 放大版 */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

a-scene,
.mindar-ui-overlay,
video,
.a-canvas {
  width: 100% !important;
  height: 100% !important;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
}

#ui {
  padding: calc(12px + env(safe-area-inset-top)) 12px
           calc(10px + env(safe-area-inset-bottom));
}

#portal {
  top: 39%;
  width: min(92vw, 490px);
  border-width: 12px;
}

#panel {
  max-height: 38vh;
  padding: 14px;
  border-radius: 20px;
}

#panel h2 {
  font-size: 20px;
  margin: 5px 0 8px;
}

#story {
  font-size: 13px;
  line-height: 1.5;
}

#choices button {
  padding: 11px;
  margin-top: 7px;
}

#foot {
  display: none;
}

</style>
</head>
<body>
<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes"
 color-space="sRGB"
 renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">
 <a-assets></a-assets>
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity id="target" mindar-image-target="targetIndex: 0">
  <a-torus position="0 0 0.08" radius="0.42" radius-tubular="0.025" color="#85eaff" material="emissive:#85eaff;emissiveIntensity:1.5" animation="property:rotation;to:0 0 360;loop:true;dur:9000;easing:linear"></a-torus>
  <a-torus position="0 0 0.09" radius="0.33" radius-tubular="0.012" color="#ff9fe5" animation="property:rotation;to:0 0 -360;loop:true;dur:6500;easing:linear"></a-torus>
  <a-text value="CTRL+Z" align="center" color="#ffffff" width="2" position="0 0 0.13"></a-text>
 </a-entity>
</a-scene>
<div id="shade"></div>
<div id="ui">
 <header>
  <div><h1>CTRL+Z</h1><small>PARALLEL LIFE LAB</small></div>
  <div id="status">尋找命運海報中</div>
 </header>
 <div id="portal"></div>
 <div>
  <div id="stats"><span id="courage">勇氣 0</span><span id="freedom">自由 0</span><span id="bond">關係 0</span></div>
  <section id="panel">
   <small id="chapter">WELCOME</small>
   <h2 id="heading">如果人生可以重選？</h2>
   <div id="story">把相機對準 CTRL+Z 海報，解鎖另一條人生路線。你也可以先體驗劇情。</div>
   <div id="choices">
    <button onclick="startGame()">開始人生實驗</button>
   </div>
  </section>
  <div id="foot">每一個選擇都有代價，沒有完美人生。</div>
 </div>
</div>
<script>
const stages=[
 {title:"第一關｜夢想還是安穩？",story:"你收到一份穩定的工作邀請，同時也有機會追逐一直想做的夢。你會怎麼選？",options:[
  {text:"追逐夢想",delta:[2,2,-1],result:"你走向未知，獲得自由，也開始承擔不確定。"},
  {text:"選擇安穩",delta:[0,-1,2],result:"你擁有穩定生活，卻偶爾想起沒有出發的自己。"}]},
 {title:"第二關｜離開還是留下？",story:"一個重要的人希望你留下，但遠方有一個難得的機會。",options:[
  {text:"前往新的城市",delta:[2,2,-1],result:"新的城市讓你成長，也讓思念變得真實。"},
  {text:"留在熟悉的地方",delta:[0,-1,2],result:"你守住珍惜的關係，也放下了一次冒險。"}]},
 {title:"第三關｜重新開始？",story:"你發現現在的人生和想像不同。你會怎麼面對？",options:[
  {text:"勇敢改變方向",delta:[2,2,0],result:"你沒有抹去過去，而是重新決定下一步。"},
  {text:"珍惜現在的生活",delta:[1,0,2],result:"你發現另一條路未必更好，現在也值得珍惜。"}]}
];
let stage=0,stats=[0,0,0],history=[],recognized=false;
const $=id=>document.getElementById(id);
function render(title,story,buttons,chapter){
 $("heading").textContent=title;
 $("story").textContent=story;
 $("chapter").textContent=chapter;
 $("choices").innerHTML="";
 buttons.forEach(b=>{
  const btn=document.createElement("button");
  btn.textContent=b.text;
  if(b.secondary)btn.className="secondary";
  btn.onclick=b.action;
  $("choices").appendChild(btn);
 });
 $("courage").textContent="勇氣 "+stats[0];
 $("freedom").textContent="自由 "+stats[1];
 $("bond").textContent="關係 "+stats[2];
}
function startGame(){
 stage=0;stats=[0,0,0];history=[];
 $("stats").style.display="flex";
 showStage();
}
function showStage(){
 if(stage>=stages.length)return ending();
 const s=stages[stage];
 render(s.title,s.story,[
  ...s.options.map((o,i)=>({text:o.text,action:()=>choose(i)})),
  {text:"↶ CTRL+Z 返回上一關",secondary:true,action:undo}
 ],"LEVEL 0"+(stage+1));
}
function choose(i){
 const s=stages[stage],o=s.options[i];
 history.push({stage,stats:[...stats]});
 stats=stats.map((n,j)=>n+o.delta[j]);
 stage++;
 render("命運正在改寫…",o.result,[
  {text:stage>=stages.length?"查看我的人生結局":"繼續下一關 →",action:showStage},
  {text:"↶ CTRL+Z 撤銷選擇",secondary:true,action:undo}
 ],"TIMELINE CHANGED");
}
function undo(){
 if(!history.length){showStage();return;}
 const old=history.pop();
 stage=old.stage;stats=old.stats;showStage();
}
function ending(){
 let title,story;
 if(stats[0]>=5&&stats[1]>=5){
  title="隱藏結局｜自由的探索者";
  story="你走過未知，也接受不確定。你的人生不是完美答案，而是你親手寫下的故事。";
 }else if(stats[2]>=4){
  title="人生結局｜溫柔的守護者";
  story="你珍惜身邊的人，也學會在關係裡尋找自己的位置。";
 }else{
  title="人生結局｜正在成長的你";
  story="沒有一條人生能避開遺憾。重要的不是重來，而是你接下來想怎麼走。";
 }
 render(title,story,[
  {text:"重新體驗另一條人生",action:startGame},
  {text:"↶ CTRL+Z 返回選擇",secondary:true,action:undo}
 ],"YOUR PARALLEL LIFE");
}
const target=$("target");
target.addEventListener("targetFound",()=>{
 recognized=true;
 $("status").textContent="海報辨識成功";
 $("portal").style.display="block";
});
target.addEventListener("targetLost",()=>{
 recognized=false;
 $("status").textContent="請重新對準海報";
 $("portal").style.display="none";
});
</script>
</body>
</html>
